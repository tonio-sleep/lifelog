name: iOS build and tests

on:
  push:
    branches:
      - native-ios-ci
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: Build Lifelog
        run: |
          set -o pipefail
          xcodebuild \
            -project native/Lifelog.xcodeproj \
            -scheme Lifelog \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-build.log

      - name: Run LifelogTests
        run: |
          set -o pipefail
          xcodebuild \
            -project native/Lifelog.xcodeproj \
            -scheme LifelogTests \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild-test.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild-build.log
            xcodebuild-test.log
