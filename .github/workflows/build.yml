name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifelog-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    name: iOS (no codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app and unsigned IPA
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Runner.app.zip
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry Runner-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: lifelog-ios-runner-app-unsigned
          path: |
            build/ios/iphoneos/Runner.app.zip
            build/ios/iphoneos/Runner-unsigned.ipa
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package Windows release
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          if (!(Test-Path $out)) { throw "Release output not found at $out" }
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath lifelog-windows-x64-release.zip -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: lifelog-windows-x64-release
          path: lifelog-windows-x64-release.zip
          if-no-files-found: error
