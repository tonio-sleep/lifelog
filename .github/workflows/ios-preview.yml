name: iOS UI preview

on:
  workflow_dispatch:

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Keep the preview workflow on the same toolchain as the IPA build.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug simulator app
        run: |
          set -o pipefail
          flutter build ios --simulator --debug --no-codesign -v 2>&1 | tee ios-preview-build.log

      - name: Boot simulator and capture Today
        run: |
          set -euo pipefail
          APP="build/ios/iphonesimulator/Runner.app"
          BUNDLE="app.lifelog.lifelog"
          test -d "$APP"

          # Pick an available iPhone instead of assuming a specific simulator
          # model exists on the runner image.
          DEVICE_ID="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone")) | select(.isAvailable == true) | .udid][0]')"
          test -n "$DEVICE_ID"
          echo "Using simulator $DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE"
          sleep 6
          xcrun simctl io "$DEVICE_ID" screenshot preview-light.png
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE" || true

          xcrun simctl ui "$DEVICE_ID" appearance dark
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE"
          sleep 6
          xcrun simctl io "$DEVICE_ID" screenshot preview-dark.png
          ls -lh preview-light.png preview-dark.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Lifelog-preview
          path: |
            preview-light.png
            preview-dark.png
          if-no-files-found: error

      - name: Upload preview build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-preview-build-log
          path: ios-preview-build.log
          if-no-files-found: ignore
