name: iOS UI preview

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build debug simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project native/Lifelog.xcodeproj \
            -scheme Lifelog \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath DerivedData-preview \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-preview.log

      - name: Boot simulator and capture Today
        run: |
          set -euo pipefail
          DEVICE="iPhone 16"
          APP="DerivedData-preview/Build/Products/Debug-iphonesimulator/Lifelog.app"
          test -d "$APP"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl install "$DEVICE" "$APP"
          SIMCTL_CHILD_LIFELOG_PREVIEW=1 xcrun simctl launch "$DEVICE" com.logginglife.lifelog
          sleep 6
          xcrun simctl io "$DEVICE" screenshot preview-light.png
          xcrun simctl terminate "$DEVICE" com.logginglife.lifelog || true
          xcrun simctl ui "$DEVICE" appearance dark
          SIMCTL_CHILD_LIFELOG_PREVIEW=1 xcrun simctl launch "$DEVICE" com.logginglife.lifelog
          sleep 6
          xcrun simctl io "$DEVICE" screenshot preview-dark.png
          ls -lh preview-light.png preview-dark.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Lifelog-preview
          path: |
            preview-light.png
            preview-dark.png
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-preview-log
          path: xcodebuild-preview.log
