name: Build iOS IPA

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS unsigned IPA
    runs-on: macos-15
    env:
      LIFELOG_API_KEY: ${{ secrets.LIFELOG_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A missing key must fail the build instead of producing an app that
      # cannot pass the Worker's app-key gate.
      - name: Verify app key
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$LIFELOG_API_KEY" ]; then
            echo "::error::LIFELOG_API_KEY repository secret is not set"
            exit 1
          fi

      # device_info_plus 13.3.x calls NSProcessInfo selectors introduced in the
      # iOS 26.1 SDK, so the runner's default Xcode 16.4 cannot compile it.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1.1"

      # Pin the SDK so CI matches the version this project is developed with.
      # `stable` drifts between runner images and changes iOS build behaviour.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Worker app-key tests
        working-directory: cloudflare-sync
        run: npm test

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --dart-define=LIFELOG_API_KEY="$LIFELOG_API_KEY"

      - name: Build iOS (release, no codesign)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --dart-define=LIFELOG_API_KEY="$LIFELOG_API_KEY" -v 2>&1 | tee ios-build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_DIR="build/ios/iphoneos"
          if [ ! -d "$APP_DIR/Runner.app" ]; then
            echo "Runner.app not found in $APP_DIR"
            ls -la build/ios || true
            exit 1
          fi
          cd "$APP_DIR"
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry lifelog-unsigned.ipa Payload
          rm -rf Payload
          ls -lh lifelog-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: lifelog-ios-unsigned-ipa
          path: build/ios/iphoneos/lifelog-unsigned.ipa
          if-no-files-found: error

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
